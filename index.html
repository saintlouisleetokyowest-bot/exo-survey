<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>次世代アシストスーツ 試着体験アンケート</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkbg: '#0b0f19',
            cardbg: '#161e2e',
            borderdark: '#26334d',
            emerald: {
              400: '#34d399',
              500: '#10b981',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(22, 30, 46, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    
    /* Custom styling for hidden radio/checkbox with sibling selector */
    .chip-input:checked + .chip-label {
      border-color: #10b981;
      background-color: rgba(16, 185, 129, 0.1);
      color: #34d399;
    }
    .chip-input:checked + .chip-label .check-icon {
      opacity: 1;
      transform: scale(1);
    }
    .check-icon {
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s ease-in-out;
    }
    
    /* Smooth transitions */
    .expandable {
      transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, margin 0.3s ease-in-out;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
    }
    .expandable.open {
      max-height: 200px;
      opacity: 1;
      margin-top: 0.5rem;
    }

    .star-btn {
      background: transparent;
      border: none;
      padding: 0.15rem;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.15s ease;
    }
    .star-btn:active {
      transform: scale(0.92);
    }
    .star-btn svg {
      width: 2.25rem;
      height: 2.25rem;
      fill: transparent;
      stroke: #64748b;
      stroke-width: 1.5;
      transition: fill 0.15s ease, stroke 0.15s ease, transform 0.15s ease;
    }
    .star-btn.active svg,
    .star-btn.preview svg {
      fill: #fbbf24;
      stroke: #fbbf24;
    }
    .star-btn:hover {
      transform: scale(1.08);
    }
  </style>
</head>
<body class="min-h-screen pb-12 font-sans selection:bg-emerald-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-darkbg/90 backdrop-blur-md border-b border-borderdark">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-darkbg font-bold">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <span class="font-bold text-sm tracking-wider text-gray-100 hidden sm:block">EXO-SURVEY</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="generateQR()" class="px-3 py-2 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 text-sm font-medium flex items-center gap-1 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
          QR
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-6">
    <!-- Title -->
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-white mb-2">次世代アシストスーツ 試着体験アンケート</h1>
      <p class="text-sm text-slate-400">率直なご感想をお聞かせください。<br>所要時間: 約2分</p>
    </div>

    <form id="surveyForm" onsubmit="submitForm(event)" class="space-y-6" novalidate>
      
      <!-- Section 1: Overall Satisfaction -->
      <section class="glass-card rounded-2xl p-5 sm:p-6 space-y-5">
        <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2 border-b border-borderdark pb-2">
          <span class="bg-emerald-500/20 text-emerald-400 w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
          総合満足度
        </h2>

        <div class="space-y-3 ">
          <label class="block text-sm font-medium text-slate-300">試着体験全体の満足度 <span class="text-red-400 ml-1">*</span></label>
          <p class="text-xs text-slate-500">試着体験全体の満足度を星で評価してください</p>
          <input type="hidden" name="satisfaction" id="satisfactionInput" value="">
          <div class="flex items-center justify-center gap-1 sm:gap-2 py-2" id="starRating"
               onmouseleave="previewStars(selectedSatisfaction)">
            <button type="button" class="star-btn" data-value="1" onclick="setSatisfaction(1)" onmouseenter="previewStars(1)" aria-label="1星">
              <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>
            <button type="button" class="star-btn" data-value="2" onclick="setSatisfaction(2)" onmouseenter="previewStars(2)" aria-label="2星">
              <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>
            <button type="button" class="star-btn" data-value="3" onclick="setSatisfaction(3)" onmouseenter="previewStars(3)" aria-label="3星">
              <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>
            <button type="button" class="star-btn" data-value="4" onclick="setSatisfaction(4)" onmouseenter="previewStars(4)" aria-label="4星">
              <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>
            <button type="button" class="star-btn" data-value="5" onclick="setSatisfaction(5)" onmouseenter="previewStars(5)" aria-label="5星">
              <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>
          </div>
          <p id="satisfactionLabel" class="text-center text-sm text-slate-400 min-h-[1.25rem]">タップして評価</p>
        </div>

      </section>

      <!-- Section 2: Usage & Fit -->
      <section class="glass-card rounded-2xl p-5 sm:p-6 space-y-5">
        <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2 border-b border-borderdark pb-2">
          <span class="bg-emerald-500/20 text-emerald-400 w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
          利用シーン・装着感について
        </h2>

        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-300">興味を持った理由・想定シーン <span class="text-xs text-slate-500 ml-1">(複数選択可)</span></label>
          <div class="space-y-2">
            <label class="block cursor-pointer"><input type="checkbox" name="scene" value="登山・ハイキング・トレッキング" class="chip-input sr-only"><div class="chip-label flex items-center justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">登山・ハイキング・トレッキング <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="scene" value="日常のウォーキング・散歩のサポート" class="chip-input sr-only"><div class="chip-label flex items-center justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">日常のウォーキング・散歩のサポート <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="scene" value="加齢による歩行不安・リハビリ・介護予防" class="chip-input sr-only"><div class="chip-label flex items-center justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">加齢による歩行不安・介護予防 <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="scene" value="業務での身体負担軽減（腰・脚部など）" class="chip-input sr-only"><div class="chip-label flex items-center justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">業務での身体負担軽減（腰・足など） <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="scene" value="その他" class="chip-input sr-only" onchange="toggleCheckboxOther('scene', 'その他', 'scene_other')"><div class="chip-label flex items-center justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">その他 <span class="check-icon text-emerald-400">✓</span></div></label>
          </div>
          <div id="scene_other" class="expandable">
            <input type="text" name="scene_other_text" class="w-full bg-darkbg border border-borderdark rounded-xl px-4 py-2 text-sm text-white focus:border-emerald-500 outline-none" placeholder="具体的なシーンをご記入ください">
          </div>
        </div>

        <div class="space-y-4 pt-2">
          <label class="block text-sm font-medium text-slate-300">装着のしやすさと重さ・フィット感</label>
          
          <div class="space-y-1.5">
            <span class="text-xs text-slate-400">装着のしやすさ</span>
            <div class="grid grid-cols-3 gap-2">
              <label class="cursor-pointer"><input type="radio" name="ease" value="とても簡単" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">とても簡単</div></label>
              <label class="cursor-pointer"><input type="radio" name="ease" value="普通" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">普通</div></label>
              <label class="cursor-pointer"><input type="radio" name="ease" value="難しい" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">難しい</div></label>
            </div>
          </div>

          <div class="space-y-1.5">
            <span class="text-xs text-slate-400">重さ</span>
            <div class="grid grid-cols-3 gap-2">
              <label class="cursor-pointer"><input type="radio" name="weight" value="非常に軽い" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">非常に軽い</div></label>
              <label class="cursor-pointer"><input type="radio" name="weight" value="気にならない" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">気にならない</div></label>
              <label class="cursor-pointer"><input type="radio" name="weight" value="やや重い" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">やや重い</div></label>
            </div>
          </div>

          <div class="space-y-1.5">
            <span class="text-xs text-slate-400">締め付け・圧迫感</span>
            <div class="grid grid-cols-3 gap-2">
              <label class="cursor-pointer"><input type="radio" name="fit" value="ちょうど良い" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">ちょうど良い</div></label>
              <label class="cursor-pointer"><input type="radio" name="fit" value="やや痛い" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">やや痛い</div></label>
              <label class="cursor-pointer"><input type="radio" name="fit" value="ズレやすい" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">ズレやすい</div></label>
            </div>
          </div>
        </div>
      </section>

      <!-- Section 3: Performance -->
      <section class="glass-card rounded-2xl p-5 sm:p-6 space-y-5">
        <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2 border-b border-borderdark pb-2">
          <span class="bg-emerald-500/20 text-emerald-400 w-6 h-6 rounded-full flex items-center justify-center text-xs">3</span>
          アシスト性能・違和感の検証
        </h2>

        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-300">アシスト力（推進力）をどのように感じましたか？</label>
          <div class="space-y-2">
            <label class="block cursor-pointer"><input type="radio" name="power" value="感動するほど楽になった" class="chip-input sr-only"><div class="chip-label p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300 text-center">感動するほど楽になった</div></label>
            <label class="block cursor-pointer"><input type="radio" name="power" value="ほどよいサポート感がある" class="chip-input sr-only"><div class="chip-label p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300 text-center">ほどよいサポート感がある</div></label>
            <label class="block cursor-pointer"><input type="radio" name="power" value="少し強すぎる・急激に感じる" class="chip-input sr-only"><div class="chip-label p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300 text-center">少し強すぎる・急激に感じる</div></label>
            <label class="block cursor-pointer"><input type="radio" name="power" value="あまり効果を感じなかった" class="chip-input sr-only"><div class="chip-label p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300 text-center">あまり効果を感じなかった</div></label>
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <label class="block text-sm font-medium text-slate-300">機械と自分の動きが合わない（違和感）瞬間はありましたか？</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer"><input type="radio" name="resistance" value="全くなかった" class="chip-input sr-only" onchange="toggleTiming(false)"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">全くなかった</div></label>
            <label class="cursor-pointer"><input type="radio" name="resistance" value="少しあった" class="chip-input sr-only" onchange="toggleTiming(true)"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">少しあった</div></label>
            <label class="cursor-pointer"><input type="radio" name="resistance" value="かなりあった" class="chip-input sr-only" onchange="toggleTiming(true)"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs sm:text-sm text-slate-300">かなりあった</div></label>
          </div>
          
          <div id="resistance_timing" class="expandable bg-darkbg/50 p-4 rounded-xl border border-emerald-500/20">
            <p class="text-xs text-emerald-400 mb-2">※どの動作で感じましたか？ (複数選択可)</p>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer"><input type="checkbox" name="timing" value="歩き出し" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs text-slate-300">歩き出し</div></label>
              <label class="cursor-pointer"><input type="checkbox" name="timing" value="急停止" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs text-slate-300">急停止</div></label>
              <label class="cursor-pointer"><input type="checkbox" name="timing" value="方向転換" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs text-slate-300">方向転換</div></label>
              <label class="cursor-pointer"><input type="checkbox" name="timing" value="階段・段差" class="chip-input sr-only"><div class="chip-label text-center py-2 border border-borderdark rounded-xl bg-cardbg text-xs text-slate-300">階段・段差</div></label>
            </div>
          </div>
        </div>
      </section>

      <!-- Section 4: Intent & Budget -->
      <section class="glass-card rounded-2xl p-5 sm:p-6 space-y-5">
        <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2 border-b border-borderdark pb-2">
          <span class="bg-emerald-500/20 text-emerald-400 w-6 h-6 rounded-full flex items-center justify-center text-xs">4</span>
          購入意欲・課題の検証
        </h2>

        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-300">気になる点・改善してほしい点 <span class="text-xs text-slate-500 ml-1">(複数選択可)</span></label>
          <div class="space-y-2">
            <label class="block cursor-pointer"><input type="checkbox" name="improvement" value="デザイン・見た目" class="chip-input sr-only"><div class="chip-label flex justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">デザイン・見た目 <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="improvement" value="稼働音" class="chip-input sr-only"><div class="chip-label flex justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">稼働音（モーター音） <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="improvement" value="安全性" class="chip-input sr-only"><div class="chip-label flex justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">安全性 <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="improvement" value="バッテリー" class="chip-input sr-only"><div class="chip-label flex justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">バッテリーの持続時間 <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="improvement" value="価格" class="chip-input sr-only"><div class="chip-label flex justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">価格 <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="improvement" value="特になし" class="chip-input sr-only"><div class="chip-label flex justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">特になし <span class="check-icon text-emerald-400">✓</span></div></label>
            <label class="block cursor-pointer"><input type="checkbox" name="improvement" value="その他" class="chip-input sr-only" onchange="toggleCheckboxOther('improvement', 'その他', 'improvement_other')"><div class="chip-label flex justify-between p-3 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">その他 <span class="check-icon text-emerald-400">✓</span></div></label>
          </div>
          <div id="improvement_other" class="expandable">
            <input type="text" name="improvement_other_text" class="w-full bg-darkbg border border-borderdark rounded-xl px-4 py-2 text-sm text-white focus:border-emerald-500 outline-none" placeholder="具体的な改善点をご記入ください">
          </div>
        </div>

        <div class="space-y-2 pt-2">
          <label class="block text-sm font-medium text-slate-300">その他、ご意見・ご要望（自由記入）</label>
          <textarea name="comments" rows="3" class="w-full bg-darkbg border border-borderdark rounded-xl px-4 py-3 text-sm text-white focus:border-emerald-500 outline-none resize-none" placeholder="ご自由にお書きください"></textarea>
        </div>
      </section>

      <!-- Section 5: Basic Info -->
      <section class="glass-card rounded-2xl p-5 sm:p-6 space-y-5">
        <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2 border-b border-borderdark pb-2">
          <span class="bg-emerald-500/20 text-emerald-400 w-6 h-6 rounded-full flex items-center justify-center text-xs">5</span>
          基本情報・ご連絡先
        </h2>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">お名前（または貴社名）<span class="text-red-400 ml-1">*</span></label>
            <input type="text" name="name" required class="w-full bg-darkbg border border-borderdark rounded-xl px-4 py-3 text-white focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition" placeholder="山田 太郎 / 株式会社サンプル">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">メールアドレス<span class="text-red-400 ml-1">*</span></label>
            <input type="email" name="email" required class="w-full bg-darkbg border border-borderdark rounded-xl px-4 py-3 text-white focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition" placeholder="example@domain.com">
          </div>
        </div>

          <div class="grid grid-cols-2 gap-2">

            <label class="cursor-pointer"><input type="radio" name="position" value="現場担当者・スタッフ" class="chip-input sr-only" onchange="toggleOther('position', 'position_other')"><div class="chip-label text-center p-2.5 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">現場担当者</div></label>
            <label class="cursor-pointer"><input type="radio" name="position" value="購買・調達担当者" class="chip-input sr-only" onchange="toggleOther('position', 'position_other')"><div class="chip-label text-center p-2.5 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">購買・調達</div></label>
            <label class="cursor-pointer"><input type="radio" name="position" value="その他" class="chip-input sr-only" onchange="toggleOther('position', 'position_other', true)"><div class="chip-label text-center p-2.5 border border-borderdark rounded-xl bg-cardbg text-sm text-slate-300">その他</div></label>

              <option value="">選択してください</option>

        </div>
      </section>

      <!-- Submit Button -->
      <p id="formError" class="hidden text-sm text-red-400 text-center bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-3"></p>
      <button type="submit" id="submitBtn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-darkbg font-bold rounded-xl text-lg shadow-lg shadow-emerald-500/20 transition transform active:scale-95 flex justify-center items-center gap-2">
        <span>アンケートを送信する</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>

    <!-- Success Message (Hidden) -->
    <div id="successMsg" class="hidden text-center py-20">
      <div class="w-20 h-20 mx-auto bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mb-6">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <h2 class="text-2xl font-bold text-white mb-2">ご回答ありがとうございました！</h2>
      <p class="text-slate-400 mb-8">送信が完了しました。貴重なご意見を製品開発に活かしてまいります。</p>
      <button onclick="location.reload()" class="px-6 py-2 rounded-lg border border-borderdark text-slate-300 hover:bg-cardbg transition">戻る</button>
    </div>
  </main>

  <!-- QR Code Modal -->
  <div id="qrModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-cardbg border border-borderdark rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white">アンケート QRコード</h3>
        <button onclick="closeModal('qrModal')" class="text-slate-500 hover:text-white transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="bg-white p-4 rounded-xl inline-block mx-auto mb-4" id="qrcode"></div>
      <p class="text-xs text-slate-400 mb-4 break-all" id="qrUrlText"></p>
      <button onclick="closeModal('qrModal')" class="w-full py-2 bg-slate-800 rounded-lg text-sm text-white hover:bg-slate-700 transition">閉じる</button>
    </div>
  </div>

  <script>
    // 答卷会发到这个邮箱（表格样式邮件）。首次使用请到邮箱点一次确认链接。
    const COLLECT_EMAIL = 'saintlouislee.tokyowest@gmail.com';
    const SUBMIT_ENDPOINT = `https://formsubmit.co/ajax/${COLLECT_EMAIL}`;

    // Helper functions for conditionally revealing "Other" inputs
    function toggleOther(radioName, targetId, isOther = false) {
      const radios = document.getElementsByName(radioName);
      let selectedValue = Array.from(radios).find(r => r.checked)?.value;
      const target = document.getElementById(targetId);
      
      if(isOther || selectedValue === 'その他') {
        target.classList.add('open');
      } else {
        target.classList.remove('open');
      }
    }

    function toggleCheckboxOther(checkboxName, triggerValue, targetId) {
      const checkboxes = document.getElementsByName(checkboxName);
      const hasOther = Array.from(checkboxes).find(c => c.value === triggerValue && c.checked);
      const target = document.getElementById(targetId);
      
      if(hasOther) {
        target.classList.add('open');
      } else {
        target.classList.remove('open');
      }
    }

    function toggleTiming(show) {
      const target = document.getElementById('resistance_timing');
      if(show) {
        target.classList.add('open');
      } else {
        target.classList.remove('open');
        // uncheck timing checkboxes if hidden
        document.getElementsByName('timing').forEach(cb => cb.checked = false);
      }
    }

    // Modal controls
    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    const SATISFACTION_LABELS = {
      1: '非常に不満',
      2: 'やや不満',
      3: '普通',
      4: '満足',
      5: '非常に満足'
    };
    let selectedSatisfaction = 0;

    function previewStars(value) {
      document.querySelectorAll('#starRating .star-btn').forEach((btn) => {
        btn.classList.toggle('active', Number(btn.dataset.value) <= value);
      });
      const label = document.getElementById('satisfactionLabel');
      if (value > 0) {
        label.textContent = `${value} / 5 〜 ${SATISFACTION_LABELS[value]}`;
        label.classList.add('text-amber-300');
        label.classList.remove('text-slate-400');
      } else {
        label.textContent = 'タップして評価';
        label.classList.remove('text-amber-300');
        label.classList.add('text-slate-400');
      }
    }

    function setSatisfaction(value) {
      selectedSatisfaction = value;
      document.getElementById('satisfactionInput').value = String(value);
      previewStars(value);
      hideFormError();
    }

    // QR Code Generation
    function generateQR() {
      const currentUrl = window.location.href;
      document.getElementById('qrcode').innerHTML = ''; // clear previous
      new QRCode(document.getElementById("qrcode"), {
        text: currentUrl,
        width: 180,
        height: 180,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });
      document.getElementById('qrUrlText').innerText = currentUrl;
      openModal('qrModal');
    }

    function showFormError(message, focusEl) {
      const box = document.getElementById('formError');
      box.textContent = message;
      box.classList.remove('hidden');
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (focusEl) {
        focusEl.focus({ preventScroll: true });
        focusEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function hideFormError() {
      const box = document.getElementById('formError');
      box.classList.add('hidden');
      box.textContent = '';
    }

    // Form Submission Logic
    async function submitForm(e) {
      e.preventDefault();
      hideFormError();

      const form = document.getElementById('surveyForm');
      const nameInput = form.querySelector('[name="name"]');
      const emailInput = form.querySelector('[name="email"]');
      const name = (nameInput.value || '').trim();
      const email = (emailInput.value || '').trim();

      if (!name) {
        showFormError('お名前（または貴社名）を入力してください。', nameInput);
        return;
      }
      if (!email || !emailInput.checkValidity()) {
        showFormError('正しいメールアドレスを入力してください。', emailInput);
        return;
      }
      if (!selectedSatisfaction) {
        showFormError('総合満足度を星で評価してください。', document.getElementById('starRating'));
        return;
      }

      const formData = new FormData(form);
      
      const getMulti = (name) => {
        return Array.from(form.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);
      };

      let industry = formData.get('industry') || '';
      if (industry === 'その他') industry += `: ${formData.get('industry_other_text') || ''}`;

      let position = formData.get('position') || '';
      if (position === 'その他') position += `: ${formData.get('position_other_text') || ''}`;

      let scenes = getMulti('scene');
      if (scenes.includes('その他')) {
        scenes = scenes.map(s => s === 'その他' ? `その他: ${formData.get('scene_other_text') || ''}` : s);
      }

      let improvements = getMulti('improvement');
      if (improvements.includes('その他')) {
        improvements = improvements.map(s => s === 'その他' ? `その他: ${formData.get('improvement_other_text') || ''}` : s);
      }

      const data = {
        _subject: '【展会问卷】次世代アシストスーツ 新しい回答',
        _template: 'table',
        _captcha: 'false',
        name,
        email,
        industry,
        position,
        age: formData.get('age') || '',
        gender: formData.get('gender') || '',
        scene: scenes.join(', '),
        ease: formData.get('ease') || '',
        weight: formData.get('weight') || '',
        fit: formData.get('fit') || '',
        power: formData.get('power') || '',
        resistance: formData.get('resistance') || '',
        timing: getMulti('timing').join(', '),
        improvement: improvements.join(', '),
        satisfaction: `${selectedSatisfaction}/5（${SATISFACTION_LABELS[selectedSatisfaction]}）`,
        comments: formData.get('comments') || '',
        timestamp: new Date().toISOString()
      };

      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span class="animate-pulse">送信中...</span>`;
      btn.disabled = true;

      try {
        const res = await fetch(SUBMIT_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await res.json().catch(() => ({}));
        const ok = res.ok && (result.success === true || result.success === 'true');
        if (!ok) {
          const msg = result.message || '';
          if (/activat/i.test(msg)) {
            throw new Error('受信メールの確認が未完了です。saintlouislee.tokyowest@gmail.com の「Activate Form」リンクを開いてから、もう一度送信してください。');
          }
          throw new Error(msg || 'submit failed');
        }

        form.classList.add('hidden');
        document.getElementById('successMsg').classList.remove('hidden');
        window.scrollTo(0,0);

      } catch (error) {
        console.error('Error submitting form:', error);
        showFormError(error.message || '送信に失敗しました。ネットワーク状況を確認して、もう一度お試しください。');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }
  </script>
